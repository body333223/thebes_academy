workflows:
  ios-ipa:
    name: iOS IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Flutter doctor
        script: |
          flutter doctor -v
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Run Flutter analyze and tests
        script: |
          flutter test
      - name: Build iPhone release application
        script: |
          flutter build ios --release --no-codesign
      - name: Package and verify IPA
        script: |
          python3 scripts/package_ipa.py
    artifacts:
      - build/ios/ipa/*.ipa

  android-build:
    name: Android APK Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Build Android Release APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
